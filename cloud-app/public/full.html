<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自营 AI 作业完成看板</title>
  <style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #101828;
  --ink-2: #344054;
  --muted: #667085;
  --line: #e4e7ec;
  --line-soft: #f0f1f3;
  --red: #d92d20;
  --red-deep: #b42318;
  --red-soft: #fef3f2;
  --green: #067647;
  --green-soft: #ecfdf3;
  --amber: #b54708;
  --amber-soft: #fffaeb;
  --blue: #175cd3;
  --blue-soft: #eff8ff;
  --purple: #6941c6;
  --purple-soft: #f4f3ff;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.04);
  --radius: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.bg-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(16, 24, 40, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16, 24, 40, 0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent 42%);
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; padding: 0 28px; }

/* topbar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 0;
  background: rgba(244, 245, 247, 0.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(228, 231, 236, 0.8);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #1d2939, #101828);
  color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 15px; letter-spacing: 0.2px; }
.brand-text small { color: var(--muted); font-size: 9px; letter-spacing: 1.4px; margin-top: 3px; }
.topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.live-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px;
  background: var(--green-soft); color: var(--green);
  font-size: 11px; font-weight: 600;
}
.live-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(6, 118, 71, 0.12); }
.live-pill.demo { background: var(--amber-soft); color: var(--amber); }
.live-pill.demo i { background: var(--amber); box-shadow: 0 0 0 3px rgba(181, 71, 8, 0.12); }
.demo-switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
.demo-switch input { accent-color: var(--ink); width: 14px; height: 14px; }
.control-group { display: flex; align-items: center; gap: 8px; }
.control {
  height: 34px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 9px;
  background: #fff; color: var(--ink-2); font: inherit; font-size: 12px;
  outline: none;
}
.control:focus { border-color: #98a2b3; box-shadow: 0 0 0 3px rgba(152, 162, 179, 0.15); }
.btn {
  height: 34px; padding: 0 13px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; font: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: 0.15s ease;
}
.btn-ghost { background: #fff; border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: #98a2b3; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #1d2939; }

/* hero */
.hero {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  padding: 40px 2px 26px;
}
.kicker { margin: 0 0 10px; font-size: 10px; letter-spacing: 2.2px; font-weight: 700; color: var(--red); }
h1 { margin: 0; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.12; letter-spacing: -1px; font-weight: 800; }
.title-dot { color: var(--red); }
.hero-sub { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
.hero-meta { text-align: right; flex: none; }
.date-stamp { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.date-week { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* kpis */
.kpis { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.kpi {
  position: relative; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 18px 16px; box-shadow: var(--shadow);
  min-height: 128px; overflow: hidden;
}
.kpi-label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
.kpi-value { margin-top: 8px; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.kpi-foot { margin-top: 10px; font-size: 11px; color: var(--muted); }
.kpi-foot b { color: var(--ink-2); }
.kpi.main { background: linear-gradient(140deg, #101828 0%, #1d2939 58%, #263445 100%); color: #fff; border-color: #1d2939; }
.kpi.main .kpi-label { color: #98a2b3; }
.kpi.main .kpi-value { color: #fff; }
.kpi.main .kpi-foot { color: #98a2b3; }
.kpi.main .kpi-foot b { color: #fff; }
.ring-wrap { position: absolute; right: 16px; bottom: 14px; width: 74px; height: 74px; }
.ring { width: 74px; height: 74px; border-radius: 50%; background: conic-gradient(#f97066 0 var(--p, 0%), rgba(255,255,255,0.12) var(--p, 0%) 100%); display: grid; place-items: center; }
.ring::after { content: attr(data-label); width: 58px; height: 58px; border-radius: 50%; background: #182230; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.kpi.warn .kpi-value { color: var(--amber); }
.kpi.danger .kpi-value { color: var(--red); }
.kpi .spark { position: absolute; right: 14px; top: 16px; width: 58px; height: 26px; opacity: 0.75; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft); }
.panel-head.compact { padding: 15px 17px 11px; align-items: center; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.1px; }
.panel-sub { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
.muted { color: var(--muted); font-size: 11px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 2px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.done { background: var(--green); }
.dot.running { background: var(--blue); }
.dot.failed { background: var(--red); }
.dot.pending { background: #98a2b3; }
.dot.na { background: #d0d5dd; }

/* matrix */
.matrix-scroll { overflow: auto; max-height: 560px; padding: 0 0 6px; }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 780px; }
table.matrix th, table.matrix td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--line-soft); }
table.matrix thead th {
  position: sticky; top: 0; z-index: 4; background: #fafbfc;
  font-size: 10px; font-weight: 600; color: var(--muted); vertical-align: bottom;
  border-bottom: 1px solid var(--line); height: 62px;
}
table.matrix thead th .th-inner { display: flex; flex-direction: column; gap: 3px; align-items: center; }
table.matrix thead th .prio { font-size: 9px; padding: 1px 5px; border-radius: 4px; background: #f2f4f7; color: var(--muted); }
table.matrix thead th .prio.P0 { background: var(--red-soft); color: var(--red-deep); }
table.matrix tbody th {
  position: sticky; left: 0; z-index: 3; background: #fff; text-align: left;
  min-width: 128px; padding-left: 16px; border-right: 1px solid var(--line-soft);
}
table.matrix tbody tr:hover th, table.matrix tbody tr:hover td { background: #fcfcfd; }
.person-cell { display: flex; align-items: center; gap: 9px; }
.avatar { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.person-meta { display: flex; flex-direction: column; line-height: 1.25; }
.person-meta strong { font-size: 12px; font-weight: 600; }
.person-meta small { font-size: 9px; color: var(--muted); }
.person-rate { font-size: 9px; color: var(--muted); margin-top: 1px; }
.cell-btn { background: none; border: 0; padding: 0; cursor: pointer; width: 100%; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: 62px; height: 26px; padding: 0 8px; border-radius: 7px;
  font-size: 10px; font-weight: 600; white-space: nowrap;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.cell-btn:hover .chip { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(16,24,40,0.1); }
.chip.done { background: var(--green-soft); color: var(--green); }
.chip.running { background: var(--blue-soft); color: var(--blue); }
.chip.failed { background: var(--red-soft); color: var(--red-deep); }
.chip.blocked { background: var(--amber-soft); color: var(--amber); }
.chip.skipped { background: var(--purple-soft); color: var(--purple); }
.chip.pending { background: #f2f4f7; color: #667085; }
.chip.na { background: transparent; color: #d0d5dd; font-weight: 400; }
.chip.overdue { box-shadow: inset 0 0 0 1px rgba(217, 45, 32, 0.45); color: var(--red-deep); background: #fff5f4; }
.chip.overdue::after { content: "!"; font-weight: 800; }

/* side */
.side { display: flex; flex-direction: column; gap: 18px; }
.side-panel { overflow: hidden; }
.progress-list { padding: 8px 17px 14px; display: flex; flex-direction: column; gap: 11px; }
.progress-item { display: flex; flex-direction: column; gap: 5px; }
.progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.progress-name { font-size: 11px; color: var(--ink-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-val { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.bar { height: 5px; border-radius: 999px; background: #f2f4f7; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #475467, #101828); transition: width 0.5s ease; }
.bar > i.full { background: linear-gradient(90deg, #12b76a, #067647); }
.bar > i.bad { background: linear-gradient(90deg, #f97066, #d92d20); }
.alert-list { padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow: auto; }
.alert-item { display: flex; gap: 9px; padding: 9px 7px; border-radius: 8px; cursor: pointer; }
.alert-item:hover { background: #fafbfc; }
.alert-icon { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--red); }
.alert-icon.overdue { background: var(--amber); }
.alert-main { min-width: 0; }
.alert-title { font-size: 11px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert-sub { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert-empty { padding: 18px 8px 22px; text-align: center; color: var(--muted); font-size: 11px; }
.alert-empty b { display: block; color: var(--green); font-size: 20px; margin-bottom: 4px; }
.count-badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red-soft); color: var(--red-deep); font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; }

/* tabs */
.tabs-panel { margin-top: 18px; }
.tabs { display: flex; gap: 2px; padding: 12px 16px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { position: relative; padding: 9px 14px 11px; border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); }
.tab.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.tab-body { padding: 18px 20px 22px; }
.hidden { display: none !important; }

/* people tab */
.people-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.person-card { border: 1px solid var(--line); border-radius: 11px; padding: 14px; background: #fff; }
.person-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.person-card-head .avatar { width: 34px; height: 34px; font-size: 12px; }
.person-card-head h3 { margin: 0; font-size: 13px; font-weight: 700; }
.person-card-head p { margin: 1px 0 0; font-size: 10px; color: var(--muted); }
.person-card-head .score { margin-left: auto; text-align: right; }
.score strong { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score span { font-size: 9px; color: var(--muted); display: block; }
.mini-tasks { display: flex; flex-direction: column; gap: 6px; }
.mini-task { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-2); }
.mini-task .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-task .chip { min-width: 52px; height: 21px; font-size: 9px; padding: 0 6px; }
.empty-state { padding: 36px 10px; text-align: center; color: var(--muted); font-size: 12px; }
.empty-state b { display: block; font-size: 28px; color: #d0d5dd; margin-bottom: 6px; }

/* trend */
.trend-wrap { border: 1px solid var(--line); border-radius: 11px; padding: 16px 14px 8px; background: linear-gradient(180deg, #fff, #fcfcfd); }
.trend-legend { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; padding-left: 4px; }
.trend-legend span { font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.trend-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.trend-svg { width: 100%; height: auto; display: block; }
.trend-svg text { font-family: inherit; }
.trend-note { font-size: 10px; color: var(--muted); padding: 0 4px 10px; }
.trend-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.trend-stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.trend-stat span { display: block; font-size: 10px; color: var(--muted); }
.trend-stat strong { display: block; font-size: 20px; font-weight: 800; margin-top: 4px; }

/* periodic */
table.data { width: 100%; border-collapse: collapse; }
table.data th, table.data td { padding: 11px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; font-size: 11px; vertical-align: top; }
table.data th { font-size: 10px; color: var(--muted); font-weight: 600; background: #fafbfc; }
table.data tr:last-child td { border-bottom: 0; }
table.data td .chip { min-width: 52px; height: 22px; font-size: 9px; }
.status-note { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 3px 7px; border-radius: 5px; background: var(--amber-soft); color: var(--amber); }
.status-note.ready { background: var(--green-soft); color: var(--green); }

/* connect */
.connect-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
.connect-card { border: 1px solid var(--line); border-radius: 11px; padding: 16px; }
.connect-card h3 { margin: 0 0 6px; font-size: 13px; }
.connect-card p { margin: 0 0 12px; font-size: 11px; color: var(--muted); }
.code { position: relative; border-radius: 8px; background: #101828; color: #e4e7ec; padding: 12px 13px; font-family: Consolas, "SFMono-Regular", monospace; font-size: 10.5px; line-height: 1.7; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.code .accent { color: #fda29b; }
.copy-btn { margin-top: 8px; }
.flow { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.flow-step { display: flex; gap: 9px; align-items: flex-start; font-size: 11px; color: var(--ink-2); }
.flow-step b { width: 18px; height: 18px; border-radius: 50%; background: #f2f4f7; color: var(--muted); display: grid; place-items: center; font-size: 9px; flex: none; }

/* footer */
.footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 2px 34px; color: var(--muted); font-size: 10px; }

/* drawer */
.drawer-mask { position: fixed; inset: 0; background: rgba(16, 24, 40, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; }
.drawer-mask.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100vw);
  background: #fff; z-index: 41; transform: translateX(104%); transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column; box-shadow: -18px 0 50px rgba(16, 24, 40, 0.16);
}
.drawer.show { transform: translateX(0); }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-kicker { margin: 0 0 3px; font-size: 9px; letter-spacing: 1.6px; color: var(--red); font-weight: 700; }
.drawer-head h3 { margin: 0; font-size: 16px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: #f9fafb; color: var(--ink); }
.drawer-body { padding: 18px 20px; overflow: auto; flex: 1; }
.detail-hero { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 11px; background: #fafbfc; border: 1px solid var(--line); margin-bottom: 16px; }
.detail-hero .avatar { width: 38px; height: 38px; font-size: 13px; }
.detail-hero h4 { margin: 0; font-size: 13px; }
.detail-hero p { margin: 1px 0 0; font-size: 10px; color: var(--muted); }
.detail-hero .chip { margin-left: auto; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.detail-box { border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; }
.detail-box span { display: block; font-size: 9px; color: var(--muted); margin-bottom: 3px; }
.detail-box strong { font-size: 11px; font-weight: 600; word-break: break-all; }
.detail-section { margin-bottom: 16px; }
.detail-section h5 { margin: 0 0 7px; font-size: 10px; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; }
.detail-section p { margin: 0; font-size: 12px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.kv-list { display: flex; flex-direction: column; gap: 5px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; border-bottom: 1px dashed var(--line-soft); padding-bottom: 5px; }
.kv span { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; word-break: break-all; }
.drawer-foot { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.drawer-foot .btn { flex: 1; min-width: 90px; }
.btn-green { background: var(--green-soft); color: var(--green); border-color: #abefc6; }
.btn-green:hover { background: #dcfae6; }
.btn-red { background: var(--red-soft); color: var(--red-deep); border-color: #fecdca; }
.btn-red:hover { background: #fee4e2; }
.btn-plain { background: #fff; border-color: var(--line); color: var(--ink-2); }
.btn-plain:hover { background: #fafbfc; }
.hint { font-size: 10px; color: var(--muted); padding: 6px 20px 0; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 16px); background: #101828; color: #fff; padding: 9px 14px; border-radius: 9px; font-size: 11px; opacity: 0; pointer-events: none; transition: 0.2s ease; z-index: 60; box-shadow: 0 8px 30px rgba(16,24,40,0.2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1200px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: grid; grid-template-columns: 1fr 1fr; }
  .kpis { grid-template-columns: 1.3fr 1fr 1fr; }
  .kpi:nth-child(4), .kpi:nth-child(5) { display: none; }
  .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {

  <script>/* global fetch */

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

const STATUS = {
  pending: { label: '未开始', cls: 'pending' },
  running: { label: '进行中', cls: 'running' },
  done: { label: '已完成', cls: 'done' },
  failed: { label: '失败', cls: 'failed' },
  blocked: { label: '阻塞', cls: 'blocked' },
  skipped: { label: '已跳过', cls: 'skipped' },
};

const AVATAR_COLORS = ['#d92d20', '#175cd3', '#067647', '#6941c6', '#b54708', '#0e7090', '#c11574'];

const state = {
  date: localDate(new Date()),
  days: 14,
  demo: false,
  data: null,
  loading: false,
};

function localDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function avatar(name, size) {
  const text = String(name || '?').slice(0, 1);
  let hash = 0;
  for (const char of String(name || '?')) hash = (hash * 31 + char.charCodeAt(0)) % 997;
  const color = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  return `<span class="avatar" style="background:${color};${size ? `width:${size}px;height:${size}px;` : ''}">${escapeHtml(text)}</span>`;
}

function statusMeta(status, overdue) {
  const meta = STATUS[status] || STATUS.pending;
  if (overdue && (status === 'pending' || status === 'running')) {
    return { label: '逾期未完成', cls: `${meta.cls} overdue` };
  }
  return meta;
}

function chip(status, overdue, compact) {
  const meta = statusMeta(status, overdue);
  return `<span class="chip ${meta.cls}"${compact ? ' style="min-width:52px;height:21px;font-size:9px"' : ''}>${escapeHtml(meta.label)}</span>`;
}

function toast(message) {
  const node = $('#toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove('show'), 2400);
}

async function loadDashboard(showSpinner = true) {
  if (state.loading) return;
  state.loading = true;
  if (showSpinner) $('#livePill').innerHTML = '<i></i> 加载中';
  const query = new URLSearchParams({ date: state.date, days: String(state.days) });
  if (state.demo) query.set('demo', '1');
  try {
    const response = await fetch(`/api/dashboard?${query.toString()}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    state.data = await response.json();
    render();
    $('#livePill').className = `live-pill${state.demo ? ' demo' : ''}`;
    $('#livePill').innerHTML = `<i></i> ${state.demo ? '演示数据' : '实时数据'}`;
    $('#exportBtn').href = `/api/export.csv?${query.toString()}`;
  } catch (error) {
    $('#livePill').className = 'live-pill demo';
    $('#livePill').innerHTML = '<i></i> 连接失败';
    toast(`看板加载失败：${error.message}`);
  } finally {
    state.loading = false;
  }
}

function render() {
  const data = state.data;
  if (!data) return;
  renderDate(data);
  renderKpis(data);
  renderMatrix(data);
  renderTaskProgress(data);
  renderAlerts(data);
  renderPeople(data);
  renderTrend(data);
  renderPeriodic(data);
  renderConnect(data);
  $('#generatedAt').textContent = `更新于 ${new Date(data.generated_at).toLocaleString('zh-CN', { hour12: false })} · ${data.source === 'demo' ? '演示模式' : '生产数据'}`;
}

function renderDate(data) {
  const [y, m, d] = data.date.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()];
  $('#dateStamp').textContent = `${m}月${d}日`;
  $('#dateWeek').textContent = `${y} · ${week}`;
  $('#datePicker').value = data.date;
}

function ring(rate) {
  const p = Math.max(0, Math.min(100, Number(rate) || 0));
  return `<div class="ring-wrap"><div class="ring" style="--p:${p}%" data-label="${p}%"></div></div>`;
}

function sparkline(trend, key, color) {
  if (!trend || trend.length < 2) return '';
  const values = trend.map((item) => Number(item[key]) || 0);
  const max = Math.max(1, ...values);
  const w = 58;
  const h = 26;
  const points = values.map((value, index) => `${(index / (values.length - 1)) * w},${h - (value / max) * (h - 3) - 1}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function renderKpis(data) {
  const k = data.kpis;
  const trend = data.trend || [];
  const html = `
    <div class="kpi main">
      <div class="kpi-label">今日完成率</div>
      <div class="kpi-value">${k.rate}<small>%</small></div>
      <div class="kpi-foot"><b>${k.done}</b> / ${k.expected} 项作业已完成</div>
      ${ring(k.rate)}
    </div>
    <div class="kpi">
      <div class="kpi-label">已完成</div>
      <div class="kpi-value">${k.done}<small> 项</small></div>
      <div class="kpi-foot">应完成 <b>${k.expected}</b> 项 · 覆盖 <b>${k.tasks_total}</b> 类作业</div>
      ${sparkline(trend, 'done', '#067647')}
    </div>
    <div class="kpi danger">

function svgTrend(trend) {
  const width = 1000;
  const height = 270;
  const pad = { left: 38, right: 18, top: 18, bottom: 34 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const x = (index) => pad.left + (trend.length <= 1 ? innerW / 2 : (index / (trend.length - 1)) * innerW);
  const y = (rate) => pad.top + innerH - (Math.max(0, Math.min(100, rate)) / 100) * innerH;
  const grid = [0, 25, 50, 75, 100].map((value) => `
    <line x1="${pad.left}" y1="${y(value)}" x2="${width - pad.right}" y2="${y(value)}" stroke="#e4e7ec" stroke-width="1" stroke-dasharray="${value === 0 ? '0' : '3 5'}"/>
    <text x="${pad.left - 9}" y="${y(value) + 3}" text-anchor="end" font-size="9" fill="#98a2b3">${value}%</text>`).join('');
  const points = trend.map((item, index) => `${x(index)},${y(item.rate)}`).join(' ');
  const area = `M ${x(0)} ${y(0)} L ${points.split(' ').join(' L ')} L ${x(trend.length - 1)} ${y(0)} Z`;
  const dots = trend.map((item, index) => `<circle cx="${x(index)}" cy="${y(item.rate)}" r="3.2" fill="#fff" stroke="#d92d20" stroke-width="2"><title>${escapeHtml(item.date)} · 完成率 ${item.rate}% · ${item.done}/${item.expected} · 失败 ${item.failed}</title></circle>`).join('');
  const labels = trend.map((item, index) => (index % Math.ceil(trend.length / 8) === 0 || index === trend.length - 1)
    ? `<text x="${x(index)}" y="${height - 12}" text-anchor="middle" font-size="9" fill="#98a2b3">${escapeHtml(item.date.slice(5))}</text>`
    : '').join('');
  return `<svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="近 14 天完成率趋势">
    <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f97066" stop-opacity="0.28"/><stop offset="100%" stop-color="#f97066" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#areaFill)"/>
    <polyline points="${points}" fill="none" stroke="#d92d20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function renderTrend(data) {
  const trend = data.trend || [];
  if (!trend.length) {
    $('#tab-trend').innerHTML = '<div class="empty-state">暂无趋势数据</div>';
    return;
  }
  const avg = Math.round((trend.reduce((sum, item) => sum + item.rate, 0) / trend.length) * 10) / 10;
  const best = trend.reduce((a, b) => (b.rate > a.rate ? b : a), trend[0]);
  const totalDone = trend.reduce((sum, item) => sum + item.done, 0);
  const totalFailed = trend.reduce((sum, item) => sum + item.failed, 0);
  $('#tab-trend').innerHTML = `
    <div class="trend-wrap">
      <div class="trend-legend"><span><i style="background:#d92d20"></i>完成率</span><span>悬停数据点查看当日明细</span></div>
      ${svgTrend(trend)}
      <div class="trend-note">统计口径：当日应完成作业（按人员与排期展开）中，状态为已完成或已跳过的占比。</div>
    </div>
    <div class="trend-stats">
      <div class="trend-stat"><span>区间平均完成率</span><strong>${avg}%</strong></div>
      <div class="trend-stat"><span>最佳单日</span><strong>${escapeHtml(best.date.slice(5))} · ${best.rate}%</strong></div>
      <div class="trend-stat"><span>累计完成</span><strong>${totalDone} 项</strong></div>
      <div class="trend-stat"><span>累计失败</span><strong style="color:${totalFailed ? '#d92d20' : '#067647'}">${totalFailed} 项</strong></div>
    </div>`;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
  } catch (error) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    toast('已复制');
  }
}

function findContext(erp, taskId) {
  const data = state.data;
  if (!data) return null;
  const person = (data.matrix.people || []).find((item) => item.erp === erp);
  const task = (data.matrix.tasks || []).find((item) => item.id === taskId);
  if (!person || !task) return null;
  return { person, task, cell: person.cells[taskId] || null };
}

function openDrawer(erp, taskId) {
  const ctx = findContext(erp, taskId);
  if (!ctx) return;
  const { person, task, cell } = ctx;
  const meta = cell ? statusMeta(cell.status, cell.overdue) : { label: '不适用', cls: 'na' };
  $('#drawerKicker').textContent = `${task.priority} · ${task.category || '作业'} · ${task.time || ''}`;
  $('#drawerTitle').textContent = task.name;
  const metrics = cell && cell.metrics ? Object.entries(cell.metrics) : [];
  const evidence = cell && cell.evidence ? Object.entries(cell.evidence) : [];
  $('#drawerBody').innerHTML = `
    <div class="detail-hero">
      ${avatar(person.name, 38)}
      <div><h4>${escapeHtml(person.name)}</h4><p>${escapeHtml(person.erp)}</p></div>
      <span class="chip ${meta.cls}">${escapeHtml(meta.label)}</span>
    </div>
    <div class="detail-grid">
      <div class="detail-box"><span>作业日期</span><strong>${escapeHtml(state.data.date)}</strong></div>
      <div class="detail-box"><span>计划时间</span><strong>${escapeHtml(task.time || '按通知')}</strong></div>
      <div class="detail-box"><span>最后更新</span><strong>${escapeHtml(cell && cell.updated_at ? new Date(cell.updated_at).toLocaleString('zh-CN', { hour12: false }) : '无记录')}</strong></div>
      <div class="detail-box"><span>耗时</span><strong>${cell && cell.duration_sec ? `${Math.round(cell.duration_sec / 60)} 分钟` : '—'}</strong></div>
    </div>
    <div class="detail-section">
      <h5>执行摘要</h5>
      <p>${escapeHtml(cell && cell.summary ? cell.summary : '暂无执行摘要')}</p>
    </div>
    ${cell && cell.error ? `<div class="detail-section"><h5>异常 / 原始原因</h5><p style="color:#b42318">${escapeHtml(cell.error)}</p></div>` : ''}
    ${metrics.length ? `<div class="detail-section"><h5>关键指标</h5><div class="kv-list">${metrics.map(([key, value]) => `<div class="kv"><span>${escapeHtml(key)}</span><b>${escapeHtml(value)}</b></div>`).join('')}</div></div>` : ''}
    ${evidence.length ? `<div class="detail-section"><h5>证据 / 回执</h5><div class="kv-list">${evidence.map(([key, value]) => `<div class="kv"><span>${escapeHtml(key)}</span><b>${escapeHtml(value)}</b></div>`).join('')}</div></div>` : ''}
    ${cell && cell.url ? `<div class="detail-section"><h5>结果链接</h5><p><a href="${escapeHtml(cell.url)}" target="_blank" rel="noreferrer">${escapeHtml(cell.url)}</a></p></div>` : ''}
    <p class="hint" style="padding:0">管理员手工修正会以「手工修正」写入采集端，不覆盖历史记录。</p>`;
  $('#drawerFoot').innerHTML = cell ? `
    <button class="btn btn-green" data-action="done" data-erp="${escapeHtml(erp)}" data-task="${escapeHtml(taskId)}" type="button">标记完成</button>
    <button class="btn btn-red" data-action="failed" data-erp="${escapeHtml(erp)}" data-task="${escapeHtml(taskId)}" type="button">标记失败</button>
    <button class="btn btn-plain" data-action="pending" data-erp="${escapeHtml(erp)}" data-task="${escapeHtml(taskId)}" type="button">重置未开始</button>` : '<span class="muted">该成员今日不适用此作业</span>';
  $('#drawer').classList.add('show');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#drawerMask').classList.add('show');
}

function closeDrawer() {
  $('#drawer').classList.remove('show');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#drawerMask').classList.remove('show');
}

async function submitManual(erp, taskId, action) {
  const ctx = findContext(erp, taskId);
  if (!ctx) return;
  const { person, task } = ctx;
  let summary = '管理员手工修正';
  let error = '';
  let status = action;
  if (action === 'done') {
    const note = window.prompt('填写完成说明（可留空）：', '管理员手工修正');
    if (note === null) return;
    summary = note || '管理员手工修正';
  } else if (action === 'failed') {
    const reason = window.prompt('请填写失败原因：', '需人工复核');
    if (!reason) return;
    error = reason;
    summary = '管理员标记失败';
  } else {
    status = 'pending';
    summary = '';
  }
  const body = {
    date: state.data.date,
    task_id: taskId,
    task_name: task.name,
    priority: task.priority,
    erp: person.erp,
    name: person.name,
    status,
    summary,
    error,
    source: 'manual-admin',
  };
  try {
    const response = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
    toast('状态已更新');
    closeDrawer();
    await loadDashboard(false);
  } catch (error) {
    toast(`更新失败：${error.message}`);
  }
}

function bindEvents() {
  $('#datePicker').addEventListener('change', (event) => {
    state.date = event.target.value || localDate(new Date());
    loadDashboard();
  });
  $('#rangePicker').addEventListener('change', (event) => {
    state.days = Number(event.target.value) || 14;
    loadDashboard();
  });
  $('#demoToggle').addEventListener('change', (event) => {
    state.demo = event.target.checked;
    loadDashboard();
  });
  $('#refreshBtn').addEventListener('click', () => loadDashboard());
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#drawerMask').addEventListener('click', closeDrawer);

  $('#matrix').addEventListener('click', (event) => {
    const button = event.target.closest('.cell-btn');
    if (button) openDrawer(button.dataset.erp, button.dataset.task);
  });
  $('#alerts').addEventListener('click', (event) => {
    const item = event.target.closest('.alert-item');
    if (item) openDrawer(item.dataset.erp, item.dataset.task);
  });
  $('#drawerFoot').addEventListener('click', (event) => {
    const button = event.target.closest('button[data-action]');
    if (button) submitManual(button.dataset.erp, button.dataset.task, button.dataset.action);
  });

  $$('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      $$('.tab').forEach((item) => item.classList.toggle('active', item === tab));
      $$('.tab-body').forEach((body) => body.classList.add('hidden'));
      $(`#tab-${tab.dataset.tab}`).classList.remove('hidden');
    });
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeDrawer();
  });

  setInterval(() => {
    if (!document.hidden) loadDashboard(false);
  }, 60000);
}

function init() {
  const params = new URLSearchParams(location.search);
  if (params.get('date')) state.date = params.get('date');
  if (params.get('days')) state.days = Number(params.get('days')) || 14;
  if (params.get('demo') === '1') state.demo = true;
  $('#datePicker').value = state.date;
  $('#rangePicker').value = String(state.days);
  $('#demoToggle').checked = state.demo;
  bindEvents();
  loadDashboard();
}

init();
</script>
